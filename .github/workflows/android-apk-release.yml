name: Android APK Release

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  ensure-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo $RELEASE_TAG"
            --notes ""
            --draft
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
            node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null
          fi

  publish-android-apk:
    needs: [ensure-release]
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      # A 4-ABI Release build (monorepo node_modules + SDK + Gradle outputs)
      # exhausts the ~14 GB free on the hosted runner and the runner agent
      # shuts itself down mid-build ("received a shutdown signal"). Reclaim
      # toolchains this build never touches before spending any disk.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "--- before ---"
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/share/swift
          docker system prune -af --volumes > /dev/null 2>&1 || true
          sudo apt-get clean
          echo "--- after ---"
          df -h / | tail -1

      # Even with the Gradle daemon and Metro capped, hermesc and the per-ABI
      # C++ compiles spike past the 16 GB host RAM right after the JS bundle
      # lands and the runner agent is OOM-killed ("The operation was canceled"
      # mid-assemble). Give the kernel a safety valve on the runner's second
      # volume — the freed root only has ~14 GB left for the build itself.
      - name: Enable swap
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # android-actions/setup-android@v3 hard-installs the long-removed
          # obsolete `tools` package (`sdkmanager tools` exits 1 with
          # "Failed to find package 'tools'"), so wire up the
          # runner-preinstalled SDK explicitly instead.
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$sdk/cmdline-tools" ]; then
            echo "::error::Android cmdline-tools not found under $sdk"
            exit 1
          fi
          if [ -d "$sdk/cmdline-tools/latest" ]; then
            cmdline_tools="$sdk/cmdline-tools/latest"
          else
            cmdline_tools="$(ls -d "$sdk"/cmdline-tools/*/ | sort -V | tail -1)"
            cmdline_tools="${cmdline_tools%/}"
          fi
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
          } >> "$GITHUB_ENV"
          {
            echo "$cmdline_tools/bin"
            echo "$sdk/platform-tools"
          } >> "$GITHUB_PATH"
          echo "Using Android SDK at $sdk ($(basename "$cmdline_tools"))"
          "$cmdline_tools/bin/sdkmanager" --version
          sdkmanager="$cmdline_tools/bin/sdkmanager"
          "$sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | "$sdkmanager" --licenses > /dev/null || true

      - name: Build workspace dependencies
        run: npm run build:app-deps

      - name: Build terminal webview
        run: npm run build:terminal-webview --workspace=@getpaseo/app

      - name: Prebuild Android project
        working-directory: packages/app
        env:
          APP_VARIANT: production
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK locally
        working-directory: packages/app/android
        shell: bash
        env:
          # Cap Metro (holds the ~6000-module graph beside the build).
          NODE_OPTIONS: --max-old-space-size=2048
          # Cap ninja's C++ compile fan-out inside each Gradle task —
          # --max-workers=1 only serializes the tasks themselves.
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -euo pipefail
          df -h / | tail -1
          free_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          if [ "$free_gb" -lt 10 ]; then
            echo "::error::Only ${free_gb} GB free before assembleRelease; the 4-ABI Release build needs headroom. Failing early instead of mid-build."
            exit 1
          fi

          # The hosted runner has 16 GB RAM. Expo's gradle-jvmargs plugin sizes
          # the daemon for a dev machine (4 GB heap + 1 GB metaspace); with the
          # Kotlin daemon, uncapped Metro, and hermesc compiling the bundle
          # beside it, the host OOMs and the runner shuts down right after the
          # JS bundle phase. Cap the daemon, compile Kotlin in-process, and
          # build serially. (gradle.properties is generated by prebuild, so
          # patching it here touches no committed file.)
          node -e "
            const fs = require('node:fs');
            const lines = [
              'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m',
              'kotlin.daemon.enabled=false',
            ];
            let s = fs.readFileSync('gradle.properties', 'utf8');
            for (const line of lines) {
              const key = line.split('=')[0];
              const re = new RegExp('^' + key.replace(/\./g, '\\\\.') + '=.*$', 'm');
              s = re.test(s) ? s.replace(re, line) : s.trimEnd() + '\n' + line + '\n';
            }
            fs.writeFileSync('gradle.properties', s);
          "
          grep -E '^(org.gradle.jvmargs|kotlin.daemon.enabled)=' gradle.properties

          ./gradlew :app:assembleRelease --no-daemon --max-workers=1 \
            -Dorg.gradle.parallel=false \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x generateReleaseLintModel -x generateReleaseLintVitalModel

      - name: Sign and stage APK
        id: artifact
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk="packages/app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$unsigned_apk"

          asset_name="paseo-${RELEASE_TAG}-android.apk"
          asset_path="$RUNNER_TEMP/$asset_name"

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::Android keystore secrets not configured; publishing the APK as built (debug-signed)."
            cp "$unsigned_apk" "$asset_path"
          else
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$asset_path" \
              "$unsigned_apk"
            rm -f "$keystore"
            "$build_tools/apksigner" verify --print-certs "$asset_path"
          fi

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          gh release upload "$release_lookup" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
