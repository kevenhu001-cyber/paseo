name: Android APK (local Gradle)

# Local Gradle Release build on the GitHub-hosted runner — no EAS, nothing runs
# on a dev machine. Pushes and pull requests produce a smoke APK artifact.
# Tag pushes (`v*`, `android-v*`) additionally upload a `-local` APK asset to
# the GitHub Release alongside the EAS-built APK (distinct file name, no clash).
#
# Release signing uses the fixed keystore stored in repository secrets so every
# build shares one signature and installs as an upgrade:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Branch/PR builds without secrets fall back to an ephemeral test key and stay
# artifact-only; tag builds fail fast when secrets are missing. See
# docs/android.md for setup.

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "android-v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. android-v0.8.0); empty builds the selected ref as artifact-only"
        required: false
        default: ""
        type: string

concurrency:
  group: android-apk-local-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  IS_TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}

jobs:
  build-local-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || '' }}

      # A 4-ABI Release build (monorepo node_modules + SDK + Gradle outputs)
      # exhausts the ~14 GB free on the hosted runner and the runner agent
      # shuts itself down mid-build ("received a shutdown signal"). Reclaim
      # toolchains this build never touches before spending any disk.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "--- before ---"
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/share/swift
          docker system prune -af --volumes > /dev/null 2>&1 || true
          sudo apt-get clean
          echo "--- after ---"
          df -h / | tail -1

      # Even with the Gradle daemon and Metro capped, hermesc and the per-ABI
      # C++ compiles spike past the 16 GB host RAM right after the JS bundle
      # lands and the runner agent is OOM-killed ("The operation was canceled"
      # mid-assemble). Give the kernel a safety valve on the runner's second
      # volume — the freed root only has ~14 GB left for the build itself.
      - name: Enable swap
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Resolve release tag
        if: ${{ env.IS_TAG_BUILD == 'true' }}
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # android-actions/setup-android@v3 hard-installs the long-removed
          # obsolete `tools` package (`sdkmanager tools` exits 1 with
          # "Failed to find package 'tools'"), so wire up the
          # runner-preinstalled SDK explicitly instead. Package install and
          # license acceptance stay in the next step.
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$sdk/cmdline-tools" ]; then
            echo "::error::Android cmdline-tools not found under $sdk"
            exit 1
          fi
          if [ -d "$sdk/cmdline-tools/latest" ]; then
            cmdline_tools="$sdk/cmdline-tools/latest"
          else
            cmdline_tools="$(ls -d "$sdk"/cmdline-tools/*/ | sort -V | tail -1)"
            cmdline_tools="${cmdline_tools%/}"
          fi
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
          } >> "$GITHUB_ENV"
          {
            echo "$cmdline_tools/bin"
            echo "$sdk/platform-tools"
          } >> "$GITHUB_PATH"
          echo "Using Android SDK at $sdk ($(basename "$cmdline_tools"))"
          "$cmdline_tools/bin/sdkmanager" --version

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/paseo-release.keystore"
            echo "Using fixed release keystore from secrets."
          elif [ "$IS_TAG_BUILD" == "true" ]; then
            echo "::error::Tag builds require the fixed release keystore secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). See docs/android.md."
            exit 1
          else
            echo "No release keystore secrets; generating an ephemeral test key (artifact-only, reinstall needs uninstall)."
            keytool -genkeypair -keystore "$RUNNER_TEMP/paseo-release.keystore" \
              -alias paseo-local -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass paseo-local -keypass paseo-local \
              -dname "CN=Paseo Local, OU=Mobile, O=Paseo, L=Unknown, ST=Unknown, C=US"
            echo "PASEO_EPHEMERAL_KEYSTORE=1" >> "$GITHUB_ENV"
            ANDROID_KEYSTORE_PASSWORD="paseo-local"
            ANDROID_KEY_ALIAS="paseo-local"
            ANDROID_KEY_PASSWORD="paseo-local"
          fi

          {
            echo "PASEO_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/paseo-release.keystore"
            echo "PASEO_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "PASEO_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "PASEO_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Build terminal webview
        run: npm run build:terminal-webview --workspace=@getpaseo/app

      - name: Expo prebuild (production)
        working-directory: packages/app
        shell: bash
        run: |
          set -euo pipefail
          APP_VARIANT=production npx expo prebuild --platform android --clean --non-interactive
          grep -q "Paseo release signing" android/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Release APK
        working-directory: packages/app/android
        shell: bash
        env:
          # Cap Metro (holds the ~5900-module graph beside the build).
          NODE_OPTIONS: --max-old-space-size=2048
          # Cap ninja's C++ compile fan-out inside each Gradle task —
          # --max-workers=1 only serializes the tasks themselves.
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -euo pipefail
          df -h / | tail -1
          free_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          if [ "$free_gb" -lt 10 ]; then
            echo "::error::Only ${free_gb} GB free before assembleRelease; the 4-ABI Release build needs headroom. Failing early instead of mid-build."
            exit 1
          fi

          # The hosted runner has 16 GB RAM. Expo's gradle-jvmargs plugin sizes
          # the daemon for a dev machine (4 GB heap + 1 GB metaspace); with the
          # Kotlin daemon, uncapped Metro, and hermesc compiling the ~5900-module
          # bundle beside it, the host OOMs and the runner shuts down right
          # after the JS bundle phase. Cap the daemon, compile Kotlin
          # in-process, and build serially (same reason the F-Droid source
          # build in docs/android.md is serial). (gradle.properties is
          # generated by prebuild, so patching it here touches no committed
          # file.)
          node -e "
            const fs = require('node:fs');
            const lines = [
              'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m',
              'kotlin.daemon.enabled=false',
            ];
            let s = fs.readFileSync('gradle.properties', 'utf8');
            for (const line of lines) {
              const key = line.split('=')[0];
              const re = new RegExp('^' + key.replace(/\./g, '\\\\.') + '=.*$', 'm');
              s = re.test(s) ? s.replace(re, line) : s.trimEnd() + '\n' + line + '\n';
            }
            fs.writeFileSync('gradle.properties', s);
          "
          grep -E '^(org.gradle.jvmargs|kotlin.daemon.enabled)=' gradle.properties

          ./gradlew assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.parallel=false

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$PWD/packages/app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          ls -la "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | head -12
          if [ "${PASEO_EPHEMERAL_KEYSTORE:-0}" == "1" ]; then
            echo "::warning::APK signed with an ephemeral test key; uninstall the previous build before installing."
          fi

      - name: Stage APK artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          src="$PWD/packages/app/android/app/build/outputs/apk/release/app-release.apk"
          if [ "$IS_TAG_BUILD" == "true" ]; then
            asset_name="paseo-${RELEASE_TAG}-local-android.apk"
          else
            asset_name="paseo-local-android-${GITHUB_SHA::8}.apk"
          fi
          cp "$src" "$RUNNER_TEMP/$asset_name"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$RUNNER_TEMP/$asset_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.asset_name }}
          path: ${{ steps.stage.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Ensure GitHub release exists
        if: ${{ env.IS_TAG_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo $RELEASE_TAG"
            --notes ""
            --draft
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
            node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null
          fi

      - name: Upload APK to GitHub Release
        if: ${{ env.IS_TAG_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          gh release upload "$release_lookup" "${{ steps.stage.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
