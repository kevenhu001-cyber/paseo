name: CLI Package

# Headless-Ubuntu path: build the server stack from source and upload the
# workspace npm tarballs (CLI + its siblings) as a downloadable artifact.
# Branch pushes are artifact-only; publishing to npm stays in the release flow
# (docs/release.md), which is also what makes the CLI tarball resolve its
# @getpaseo/* deps from the registry.

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/protocol/**"
      - "packages/highlight/**"
      - "packages/relay/**"
      - "packages/plugin/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: cli-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Pack workspace tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-package"
          for pkg in highlight relay protocol client plugin server cli; do
            npm pack --workspace="@getpaseo/$pkg" --pack-destination "$RUNNER_TEMP/cli-package"
          done
          ls -la "$RUNNER_TEMP/cli-package"

      - name: Upload CLI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-cli-${{ github.sha }}
          path: ${{ runner.temp }}/cli-package/*
          if-no-files-found: error
          retention-days: 14
